# ─────────────────────────────────────────────────────────────────
# SLD Inference Viewer — Nginx reverse proxy config
# ─────────────────────────────────────────────────────────────────
# Installation (Ubuntu):
#   sudo apt install nginx
#   sudo cp nginx/sld-inference.conf /etc/nginx/sites-available/sld-inference
#   sudo ln -s /etc/nginx/sites-available/sld-inference /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # Serve the built React app (vite build output)
    root /opt/SLD-Inference/frontend/dist;
    index index.html;

    # SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to FastAPI (uvicorn)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for tiled inference (many tiles × large image)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Allow large SLD images (up to 50 MB)
        client_max_body_size 50M;
    }

    # Health check proxied to FastAPI
    location /health {
        proxy_pass http://127.0.0.1:8000;
    }
}
