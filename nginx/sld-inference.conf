# ─────────────────────────────────────────────────────────────────
# SLD Inference Viewer — Nginx reverse proxy config
# ─────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # Allow large PyTorch model weight uploads (up to 3 GB)
    client_max_body_size 3000M;

    # Serve the built React app (vite build output)
    root /opt/SLD-Inference/frontend/dist;
    index index.html;

    # SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to FastAPI (uvicorn)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for tiled inference & model weight uploads
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /models/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /infer {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Health check proxied to FastAPI
    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    # Logs proxied to FastAPI
    location /logs {
        proxy_pass http://127.0.0.1:8000;
    }
}
